<style>

function docsOf(code){var f=form(code);if(!f)return [];return (DATA.docs||[]).filter(function(d){return d.formId===f.id&&d.status!=='deleted'&&!d.deleted})}
function latest(arr){return arr.slice().sort(function(a,b){return String(b.updatedAt||b.createdAt).localeCompare(String(a.updatedAt||a.createdAt))})[0]}
function nowMin(){var n=new Date();return n.getHours()*60+n.getMinutes()+n.getSeconds()/60}
function today(){return dstr(new Date())}

/* ───────── 일지 해석 ───────── */
/* 생산작업일보 1건 → 배치 목록 (시각은 '오늘 0시' 기준 분, 자정 넘김 처리) */
function parseLineDoc(doc,L,off){
 var prods=[];for(var rr=3;rr<=6;rr++){var nm=G(doc,'g2_'+rr+'_'+(2*L.h)),n=num(G(doc,'g2_'+rr+'_'+(2*L.h+1)));if(nm)prods.push({nm:nm,n:n||0})}
 function prodFor(i){var c=0;for(var k=0;k<prods.length;k++){c+=prods[k].n;if(i<c)return prods[k].nm}return prods.length?prods[prods.length-1].nm:''}
 var roll=0,prev=null;function abs(t){if(t==null)return null;var a=t+roll+off;if(prev!=null&&a<prev-360){roll+=1440;a+=1440}prev=a;return a}
 var out=[];
 for(var r=10;r<=24;r++){var i=r-10,c=function(n){return G(doc,'g2_'+r+'_'+n)};
  var has=[1,2,3,6,8,9,10,11,13,15].some(function(n){return c(n)!==''});if(!has)continue;
  var tin=abs(tmin(c(1))),tmix=abs(tmin(c(11))),tmov=abs(tmin(c(13)));
  out.push({i:i,label:(i+1)+'B',tin:tin,tmix:tmix,tmov:tmov,conc:c(2),ph:c(3),inW:c(5),brix0:c(6),adj:c(7),brix:c(8),lvl:c(9),temp:c(10),mixer:c(12),mover:c(14),pbrix:c(15),prod:prodFor(i)})}
 var planned=prods.reduce(function(a,p){return a+p.n},0);
 return {prods:prods,product:prods.map(function(p){return p.nm}).join(' · '),planned:planned,batches:out};
}
/* CIP 일보 → 탱크(행)별 CIP 기록 */
function cipEvents(code,pre,row,s,e,dates){
 var out=[];dates.forEach(function(ds,di){var off=(new Date(ds+'T00:00:00')-new Date(today()+'T00:00:00'))/60000;
  docsOf(code).filter(function(d){return docDate(d)===ds}).forEach(function(d){var a=tmin(G(d,pre+'_'+row+'_'+s)),b=tmin(G(d,pre+'_'+row+'_'+e));if(a==null)return;var A=a+off,B=b==null?null:b+off;if(B!=null&&B<A)B+=1440;
   out.push({s:A,e:B,kind:G(d,pre+'_'+row+'_kind'),doc:d})})});
 return out.sort(function(x,y){return x.s-y.s});
}
function lineDoc(L,ds){var a=docsOf('FRM-012').filter(function(d){return docDate(d)===ds&&(G(d,'hogi')===L.h+'호기'||G(d,'hogi')===String(L.h))});return a.length?latest(a):null}
function moveMinOf(L){return L.cap/L.rate*60}

/* ───────── 현황 계산 ───────── */
function computeLive(){
 var T=today(),Y=addDays(T,-1),m=nowMin(),cats=CATS(SUMMER);
 var flags=[],missing=[],lines=[],notes=[];
 LINES.forEach(function(L){
  var doc=lineDoc(L,T),off=0;if(!doc){doc=lineDoc(L,Y);off=-1440}
  var P=doc?parseLineDoc(doc,L,off):{prods:[],product:'',planned:0,batches:[]};
  var o2=only2(L,P.product),k=o2?2:3,mm=moveMinOf(L),ck=catOf(P.product),cat=cats[ck];
  var mixDur=P.batches.filter(function(b){return b.tin!=null&&b.tmix!=null&&b.tmix>b.tin}).map(function(b){return b.tmix-b.tin});
  var avgMix=mixDur.length?mixDur.reduce(function(a,b){return a+b},0)/mixDur.length:MIXDEF;
  var movEnd=null;P.batches.forEach(function(b){if(b.tmov!=null&&b.tmov+mm>m)movEnd=Math.max(movEnd||0,b.tmov+mm)});
  var tanks=L.tk.map(function(id,ti){
   var o={id:id,ti:ti,line:L,state:'빈 탱크',sub:'오늘 기록 없음',color:'var(--empty)',lv:'',level:0,sp:0,batch:null,msg:'',cip:null,off:false};
   if(o2&&ti===2){o.off=true;o.state='미사용';o.sub='멸균유 · A2 · 락토프리는 1 · 2번만';return o}
   var bs=P.batches.filter(function(b){return b.i%k===ti}),b=bs[bs.length-1];
   var ce=cipEvents(L.cip.f,L.cip.p,L.cip.rows[ti],L.cip.s,L.cip.e,[Y,T]),c=ce[ce.length-1];
   function cipState(){o.cip=c;if(c.e==null){o.state='CIP 중';o.color='var(--cip)';o.level=.12;o.sp=0;o.spray=true;o.sub='종료 예상 약 '+hh(c.s+CIPMIN);o.eta=c.s+CIPMIN}else{o.state='CIP 완료';o.color='var(--empty)';o.sub=hh(c.e)+' 완료 · 유입 가능'}}
   o.batch=b||null;
   if(b&&b.tmov!=null){var end=b.tmov+mm;
    if(c&&c.s>=b.tmov-10)cipState();
    else if(m<end){o.state='이송 중';o.color='var(--move)';o.sp=2;o.level=Math.max(.04,.95*(1-(m-b.tmov)/mm));o.sub='종료 예상 '+hh(end);o.eta=end}
    else{o.state='이송 완료';o.color='var(--move)';o.level=.03;o.sub='CIP 필요';o.needCip=end;
     if(m-end>30)missing.push({where:'L'+L.h+'호기 '+id+' · '+b.label,what:'이송 끝났는데 CIP 시작 기록 없음',form:L.cip.f==='FRM-042'?'CIP 및 살균 작업 일보 (기존 배합실)':'CIP 및 살균 작업 일보 (신규 배합실)'})}}
   else if(b&&b.tmix!=null){var w=m-b.tmix;o.state='이송 대기';o.color='var(--ready)';o.sp=3;o.level=.95;
    var projEnd=Math.max(m,movEnd||m)+mm,proj=projEnd-b.tmix;
    if(w>=cat.silo){o.lv='red';o.sub='품질 이상 주의 · '+dur(w);o.msg='조합탱크 보관 기준('+dur(cat.silo)+')을 넘었습니다 (현재 '+dur(w)+'). SILO로 냉각 이송하고 팀장에게 보고하세요.'}
    else if(w>=cat.insp){o.lv='amber';o.sub='추가 검사 · '+dur(w);o.msg='배합 완료 후 '+dur(w)+' 경과 — 추가 검사 기준('+dur(cat.insp)+')을 넘었습니다. pH · Brix · 침전도 검사를 하세요. 냉각 이송 기준('+dur(cat.silo)+')까지 '+dur(cat.silo-w)+' 남았습니다'+(proj>cat.silo?' — 이송이 끝나면 기준을 넘을 것으로 예상되니 냉각 이송을 검토하세요.':'. 시간이 빠듯하면 생산 중 10분 간격으로 검사하세요.')}
    else if(proj>cat.silo){o.lv='pred';o.sub='대기 '+dur(w)+' · 초과 예상';o.msg='앞 배치 이송이 끝난 뒤 이송하면 '+hh(projEnd)+'에 끝나며, 그때 배합 완료 후 경과 시간은 '+dur(proj)+'입니다. 기준('+dur(cat.silo)+')을 넘을 것으로 예상되니 냉각 이송을 검토하거나 생산 중 10분 간격(pH · Brix · 침전도)으로 검사하세요.'}
    else o.sub='대기 '+dur(w)+' · 검사까지 '+dur(cat.insp-w);
    o.wait=w;o.queue=Math.max(m,movEnd||m)}
   else if(b){o.state='혼합 중';o.color='var(--mix)';o.sp=1;var st=b.tin!=null?b.tin:null;o.level=st!=null?Math.min(.95,.35+(m-st)/avgMix*.6):.6;o.sub=st!=null?'완료 예상 '+hh(st+avgMix):'유입 시각 미기록';o.eta=st!=null?st+avgMix:null}
   else if(c)cipState();
   if(o.lv)flags.push({lv:o.lv,text:L.h+'호기 '+id+' · '+(b?b.label:'')+' — '+o.msg});
   if(o.state==='CIP 중')flags.push({lv:'cip',text:L.h+'호기 '+id+' CIP 진행 중 — 약 '+hh(c.s+CIPMIN)+' 종료 예상'});
   if(c&&!c.kind&&c.s>=-60)missing.push({where:L.h+'호기 '+id,what:'CIP 시작 기록은 있는데 CIP 종류 미선택',form:'CIP 및 살균 작업 일보 · CIP 종류'});
   if(c&&c.e==null&&m-c.s>120)missing.push({where:L.h+'호기 '+id,what:'CIP 시작 후 2시간이 지났는데 종료 시각 미입력',form:'CIP 및 살균 작업 일보 · 종료시간'});
   return o});
  /* 배치 기록 누락 */
  if(doc&&off===0){P.batches.forEach(function(b){var w=L.h+'호기 '+b.label;
   if(b.tmix!=null&&!b.brix)missing.push({where:w,what:'혼합 완료 시각은 있는데 최종 Brix 미입력',form:'제품생산작업일보 · 최종 Brix'});
   if(b.tmix!=null&&!b.mixer)missing.push({where:w,what:'혼합 작업자 미입력',form:'제품생산작업일보 · 혼합 작업자'});
   if(b.tmov!=null&&!b.mover)missing.push({where:w,what:'이송 작업자 미입력',form:'제품생산작업일보 · 이송 작업자'});
   if(b.tmov!=null&&m-b.tmov>20&&!b.pbrix)missing.push({where:w,what:'이송 시작했는데 제품 Brix 미입력',form:'제품생산작업일보 · 제품 Brix'})});
   [[17,12*60,'오전'],[18,18*60,'오후']].forEach(function(x){if(m<x[1])return;var blank=[],bad=[];for(var r=10;r<=24;r++){var nm=r<=23?CHECK_ITEMS[r-10]:G(doc,'g2_24_16');if(!nm)continue;var v=G(doc,'g2_'+r+'_'+x[0]);if(!v)blank.push(nm);else if(v==='X')bad.push(nm)}
    if(blank.length)missing.push({where:L.h+'호기 '+x[2]+' 점검',what:'점검 항목 '+blank.length+'개 미체크 ('+blank.slice(0,3).join(', ')+(blank.length>3?' 외':'')+')',form:'제품생산작업일보 · 점검 항목 '+x[2]});
    if(bad.length)flags.push({lv:'chk',text:L.h+'호기 '+x[2]+' 점검 X — '+bad.join(', ')})});
   ['g2_note','g2_etc'].forEach(function(kk){var v=G(doc,kk);if(v)notes.push(L.h+'호기 — '+v)})}
  /* 다음 할 일 */
  var steps=[];tanks.forEach(function(t){if(t.off)return;var b=t.batch;
   if(t.state==='이송 중')steps.push({at:t.eta,text:t.id+' '+b.label+' 이송 종료 → CIP 시작'});
   if(t.state==='이송 완료')steps.push({at:m,text:t.id+' CIP 시작 (이송 끝남)',u:true});
   if(t.state==='혼합 중'&&t.eta!=null)steps.push({at:t.eta,text:t.id+' '+b.label+' 혼합 완료 → 최종 Brix · 온도 기록'});
   if(t.state==='CIP 중')steps.push({at:t.eta,text:t.id+' CIP 종료 → 다음 배치 유입'});
   if(t.state==='CIP 완료')steps.push({at:m,text:t.id+' 다음 배치 유입 가능'});
   if(t.state==='이송 대기')steps.push({at:t.queue+.01,text:t.id+' '+b.label+' 이송 시작'+(t.lv==='red'?' (냉각 이송 검토)':t.lv==='amber'?' (추가 검사 후)':t.lv?' (초과 예상 · 냉각 이송 검토)':''),u:!!t.lv})});
  steps.sort(function(a,b){return a.at-b.at});
  var moved=P.batches.filter(function(b){return b.tmov!=null}).length,remain=Math.max(0,P.planned-moved);
  var foot=(o2?'탱크 1 · 2번 교대 운영 · ':'')+(P.planned?'남은 배치 '+remain+'B'+(remain?' · 생산 종료 예상 '+hh(Math.max(m,movEnd||m)+remain*mm):' · 계획 배치 완료'):'작업현황(품목 · 생산량) 미입력');
  lines.push({L:L,doc:doc,off:off,P:P,cat:cat,ck:ck,tanks:tanks,steps:steps.slice(0,4),foot:foot,moved:moved,remain:remain})});
 /* SILO */
 var silos=SILOS.map(function(s){var ce=cipEvents('FRM-042','cB',s.row,11,12,[Y,T]),c=ce[ce.length-1];return {s:s,cip:c}});
 return {lines:lines,flags:flags,missing:missing,notes:notes,silos:silos,m:m,cats:cats};
}

function wave(y,amp,x1){var d='M-18 '+y.toFixed(1);for(var x=-18;x<x1;x+=9)d+=' q4.5 '+(x%18===0?-amp:amp)+' 9 0';return d+' L'+x1+' 110 L-18 110 Z'}
function tankSvg(t,product){

 var wv=lvl>0?'<g clip-path="url(#ck'+t.id+')"><g class="'+(sp?'w'+sp:'w3')+'"><path data-wave d="'+wave(80-66*lvl,sp===1?2.6:1.4,74)+'" fill="'+fill+'" stroke="#94A3B8" stroke-width="0.7"></path></g></g>':'';
 var spin=sp?'s'+sp:'';
 var drops='';if(t.spray){[9,14,19,24,31,36,41,46].forEach(function(x,i){drops+='<rect class="d" x="'+x+'" y="17" width="1.5" height="4" rx=".75" fill="#0EA5E9" style="animation-delay:-'+((i*0.37)%1.1).toFixed(2)+'s"></rect>'});drops+='<circle cx="28" cy="15" r="3.5" fill="#0EA5E9" stroke="#0369A1"></circle>'}

  '<rect x="21" y="1" width="14" height="9" rx="2" fill="#475569"></rect><line x1="28" y1="10" x2="28" y2="71" stroke="#1E293B" stroke-width="2"></line><g class="'+spin+'"><rect x="17" y="47" width="22" height="3.5" rx="1.75" fill="#1E293B"></rect></g><g class="'+spin+' ph"><rect x="17" y="68" width="22" height="3.5" rx="1.75" fill="#1E293B"></rect></g>'+drops+'</svg>';
}

  '<div class="tw"><table><thead><tr><th>호기</th><th>주 제품 분류</th><th>추가 검사 기준 넘김</th><th>냉각 이송 기준 넘김</th></tr></thead><tbody>'+lines.map(function(r){var cn=Object.keys(r.cats).sort(function(x,y){return r.cats[y]-r.cats[x]})[0]||'-';return '<tr><td><b>'+r.L.h+'호기</b></td><td>'+cn+'</td><td style="font-weight:700;color:'+(r.insp?'var(--ready)':'inherit')+'">'+r.insp+'회</td><td style="font-weight:700;color:'+(r.silo?'var(--red)':'inherit')+'">'+r.silo+'회</td></tr>'}).join('')+'</tbody></table></div></section>';
 var maxP=Math.max.apply(null,lines.map(function(r){return Math.max(r.plan,r.act)}).concat([1]));
 var kwk=Object.keys(R.kwc),maxK=Math.max.apply(null,kwk.map(function(k){return R.kwc[k]}).concat([1]));
 var plan='<section class="card"><h2>생산계획 대비 실적 (배치)</h2><span class="note">계획 = 일지 작업현황 생산량(Batch) 합계 · 실적 = 이송 시각이 적힌 배치 · 회색 = 계획, 남색 = 실적</span>'+lines.map(function(r){var rt=r.plan?Math.round(r.act/r.plan*100):null;return '<div class="bar" title="'+r.L.h+'호기 계획 '+r.plan+'B · 실적 '+r.act+'B"><b>'+r.L.h+'호기</b><div class="track" style="background:transparent"><div class="fill" style="width:'+(r.plan/maxP*100)+'%;background:#E2E8F0"></div><div class="fill" style="top:4px;height:10px;width:'+(r.act/maxP*100)+'%;background:var(--ink)"></div></div><span><b>'+r.act+'</b> / '+r.plan+'B'+(rt!=null?' · <b style="color:'+(rt>=95?'var(--move)':rt>=85?'var(--ready)':'var(--red)')+'">'+rt+'%</b>':'')+'</span></div>'}).join('')+
  '<h2 style="font-size:13.5px;margin-top:6px">지연 · 문제 언급 (일지 비고 · 특이사항 키워드)</h2>'+kwk.map(function(k){return '<div class="bar" style="grid-template-columns:130px 1fr 60px" title="'+k+' '+R.kwc[k]+'건"><span>'+k+'</span><div class="track" style="height:14px"><div class="fill" style="height:14px;width:'+(R.kwc[k]/maxK*100)+'%;background:var(--ready)"></div></div><b>'+R.kwc[k]+'건</b></div>'}).join('')+'</section>';
 var SEG=[['혼합','var(--mix)','mix'],['이송','var(--move)','move'],['CIP','var(--cip)','cip'],['이송 대기','var(--ready)','wait'],['유휴','#64748B','idle']];
 var util='<section class="card"><h2>조합탱크 가동률 (시간 비율)</h2><span class="note">일지가 있는 날의 시간(오늘은 지금까지) × 사용 탱크 수 기준 · 혼합 = 유입~혼합 완료, 대기 = 혼합 완료~이송, 이송 = 배치 × 이송 시간, CIP = CIP 시작~종료</span><div style="display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px">'+SEG.map(function(s){return '<span><i style="display:inline-block;width:12px;height:12px;border-radius:3px;background:'+s[1]+';vertical-align:-1px;margin-right:6px"></i>'+s[0]+'</span>'}).join('')+'</div>'+
  lines.map(function(r){var tot=r.span;if(!tot)return '<div class="bar" style="grid-template-columns:56px 1fr"><b>'+r.L.h+'호기</b><span class="note">기록 없음</span></div>';var v={mix:r.mix,move:r.move,cip:r.cip,wait:r.wait};v.idle=Math.max(0,tot-r.mix-r.move-r.cip-r.wait);
   return '<div class="bar" style="grid-template-columns:56px 1fr"><b>'+r.L.h+'호기</b><div class="seg">'+SEG.map(function(s){var p=Math.round(v[s[2]]/tot*100);if(!p)return '';return '<div style="width:'+p+'%;background:'+s[1]+'" title="'+r.L.h+'호기 '+s[0]+' '+p+'%">'+(p>=14?s[0]+' '+p+'%':p>=6?p+'%':'')+'</div>'}).join('')+'</div></div>'}).join('')+
  '<h2 style="font-size:13.5px;margin-top:6px">CIP 시간이 평소보다 긴 경우 ('+(R.avgC?'평균 '+dur(R.avgC)+'의 ':'평균의 ')+'1.3배 넘음)</h2>'+(R.cipLong.length?R.cipLong.map(function(c){return '<div class="row"><span><b>'+c.tank+'</b> · '+c.ds.slice(5).replace('-','/')+(c.kind?' · '+esc(c.kind):'')+'</span><span class="v" style="color:var(--ready)">'+dur(c.du)+'</span></div>'}).join(''):'<div class="empty">해당 없음 (또는 CIP 기록 3건 미만)</div>')+'</section>';
 var ds=R.dates.slice(-Math.min(R.dates.length,14)),vals=ds.map(function(d){var x=R.daily[d];return x.hrs?Math.round(x.kg/x.hrs):0}),mx=Math.max.apply(null,vals.concat([1]));
 var labor='<section class="card"><h2>인시생산량 (kg / 인시)</h2><span class="note">하루 배합량(이송 배치 × 용량) ÷ 근무일보(배합팀) 근무 + OT + 심야 시간 · 최근 '+ds.length+'일</span>'+(vals.some(Boolean)?'<div class="vbars">'+ds.map(function(d,i){var x=R.daily[d];return '<div title="'+d+' · '+(x.kg/1000).toFixed(1)+'톤 ÷ '+x.hrs+'인시"><span>'+(vals[i]||'')+'</span><i style="height:'+Math.round(vals[i]/mx*130)+'px"></i></div>'}).join('')+'</div><div class="vlab">'+ds.map(function(d){return '<span>'+d.slice(5).replace('-','/')+'</span>'}).join('')+'</div>':'<div class="empty">근무일보와 생산작업일보가 같은 날 모두 있어야 계산됩니다.</div>')+'</section>';
 var A=R.appr;
 var appr='<section class="card"><h2>배합팀 일지 · 결재 현황</h2><span class="note">선택한 기간에 작성된 배합팀 일지 기준</span><div class="kp"><div><span>작성 중 · 임시</span><b>'+A.temp+'</b></div><div><span>결재 대기</span><b style="color:var(--ready)">'+A.pend+'</b></div><div><span>반려</span><b style="color:var(--red)">'+A.rej+'</b></div><div><span>결재 완료</span><b style="color:var(--move)">'+A.done+'</b></div></div>'+
  '<h2 style="font-size:13.5px">결재 대기 일지</h2>'+(R.pend.length?R.pend.slice(0,8).map(function(d){var age=Math.floor((Date.now()-new Date(d.updatedAt||d.createdAt))/86400000);return '<div class="row"><span>'+esc(d.title||'')+'</span><span class="v" style="color:'+(age>=1?'var(--red)':'var(--mute)')+'">'+(age>=1?age+'일째':'오늘')+'</span></div>'}).join(''):'<div class="empty">결재 대기 일지가 없습니다.</div>')+'</section>';
 var silo2='<section class="card"><h2>SILO 소진 예측</h2><div class="empty">SILO 잔량을 기록하는 칸이 아직 없어 소진 시각을 계산할 수 없습니다. 하루 1~2번 SILO 잔량을 적는 칸을 일지에 추가하면 생산계획 사용량과 비교해 자동으로 예측합니다.</div></section>';
 box.innerHTML=head+'<div class="grid2" style="grid-template-columns:repeat(auto-fit,minmax(420px,1fr))">'+waits+plan+util+labor+silo2+appr+'</div>';
}

/* ───────── 화면 · 데이터 ───────── */
function setTab(t){TAB=t;['live','mgr','plan'].forEach(function(k){document.getElementById('tab-'+k).classList.toggle('on',k===t);var v=document.getElementById('v-'+k);v.classList.toggle('hide',k!==t);v.style.display=k===t?'flex':'none'});
 if(t==='plan'){var f=document.getElementById('planFrame');if(!f.getAttribute('src'))f.setAttribute('src','index.html?embed=1#/planconv')}
 try{localStorage.setItem('mix_tab',t)}catch(e){}render()}
function goPortal(){try{if(window.opener&&!window.opener.closed){window.opener.focus();return}}catch(e){}location.href='index.html'}
function summerUI(){var b=document.getElementById('summerBtn');b.textContent=SUMMER?'하절기 기준 적용 중':'하절기 기준 꺼짐';b.style.background=SUMMER?'#FEF3C7':'#fff';b.setAttribute('aria-pressed',SUMMER?'true':'false')}
document.getElementById('summerBtn').onclick=function(){SUMMER=!SUMMER;try{localStorage.setItem('mix_summer',SUMMER?'1':'0')}catch(e){}summerUI();document.querySelectorAll('.line').forEach(function(l){l.dataset.sig=''});render()};
function render(){if(!DATA)return;try{if(TAB==='live')renderLive();else if(TAB==='mgr')renderMgr()}catch(e){console.error(e)}}
function session(){var s=null;try{s=JSON.parse(sessionStorage.getItem('yum_sess')||localStorage.getItem('yum_sess')||'null')}catch(e){}if(!s)return null;if(s.exp&&Date.now()>s.exp)return null;return s}
function gate(msg){var g=document.getElementById('gate');g.innerHTML='<h1 style="margin:0;font-size:22px">배합팀 업무포털</h1><p style="margin:0;color:#475569;line-height:1.7">'+msg+'</p><a class="btn dark" style="display:flex;align-items:center;justify-content:center;text-decoration:none" href="index.html">부문포털로 가기</a>';g.classList.remove('hide');document.getElementById('app').classList.add('hide')}
function checkUser(){var s=session();if(!s){gate('부문포털에 로그인한 뒤, 홈 화면의 <b>배합팀 업무포털</b> 배너를 눌러 열어 주세요.');return false}
 var u=(DATA&&DATA.users||[]).find(function(x){return x.id===s.uid});if(DATA&&DATA.users&&(!u||u.status!=='active')){gate('승인된 사용자만 볼 수 있습니다. 부문포털에서 다시 로그인해 주세요.');return false}
 document.getElementById('gate').classList.add('hide');document.getElementById('app').classList.remove('hide');return true}
function setSync(t,ok){var e=document.getElementById('sync');e.textContent=t;e.style.color=ok?'#15803D':'#B45309'}
var SB=null;
async function pull(first){
 try{if(!SB&&window.supabase)SB=window.supabase.createClient(SUPA_URL,SUPA_ANON);if(!SB)throw new Error('no client');
  var m=await SB.from('app_state').select('updated_at').eq('id',1).maybeSingle();if(m.error)throw m.error;
  if(!first&&m.data&&m.data.updated_at===LAST_AT){setSync('서버 연결됨 · '+hh(nowMin())+' 확인',true);return}
  var r=await SB.from('app_state').select('data,updated_at').eq('id',1).maybeSingle();if(r.error)throw r.error;
  if(r.data&&r.data.data){DATA=r.data.data;LAST_AT=r.data.updated_at;document.querySelectorAll('.line').forEach(function(l){l.dataset.sig=''});setSync('서버 연결됨 · '+hh(nowMin())+' 갱신',true);if(checkUser())render()}}
 catch(e){console.warn('[mix pull]',e);setSync(DATA?'⚠ 서버 미연결 · 이 PC에 저장된 데이터 표시 중':'⚠ 서버 미연결',false)}
}
function boot(){
 try{var c=localStorage.getItem(DBKEY);if(c)DATA=JSON.parse(c)}catch(e){}
 try{var t=localStorage.getItem('mix_tab');if(t==='mgr'||t==='plan')TAB=t}catch(e){}
 summerUI();
 if(DATA){if(checkUser())setTab(TAB)}else if(!session())gate('부문포털에 로그인한 뒤, 홈 화면의 <b>배합팀 업무포털</b> 배너를 눌러 열어 주세요.');
 pull(true).then(function(){if(DATA&&checkUser())setTab(TAB)});
 setInterval(function(){pull(false)},30000);
 setInterval(function(){var n=new Date();document.getElementById('clock').textContent=pad(n.getHours())+':'+pad(n.getMinutes())},1000);
 setInterval(function(){if(TAB==='live')render()},15000);
 window.addEventListener('storage',function(e){if(e.key===DBKEY&&e.newValue){try{DATA=JSON.parse(e.newValue);render()}catch(x){}}});
}
boot();
</script>
</body>
